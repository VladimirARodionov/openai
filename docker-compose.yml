name: ${COMPOSE_PROJECT_NAME}
services:
  couchbase:
    build:
      dockerfile: Dockerfile_couchbase
    ports:
      - "${COUCHBASE_HTTP_PORT}:8091"
    volumes:
      - couchbase_data:/opt/couchbase/var
      - couchbase_init:/opt/couchbase/init_done
      - ./backups:/opt/couchbase/backup
    restart: always
    env_file:
      - .env
    environment:
      - COUCHBASE_BUCKET=vector_store
      - COUCHBASE_BUCKET_RAMSIZE=512
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8091"]
      interval: 30s
      timeout: 30s
      retries: 5
  postgres:
    build:
      dockerfile: Dockerfile_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - WEBDAV_LOGIN=${WEBDAV_LOGIN}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD}
      - WEBDAV_URL=${WEBDAV_URL}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      - TZ=${TZ}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  deepseek:
    build:
      dockerfile: Dockerfile_deepseek
    ports:
      - "11434:11434"
    volumes:
      - deepseek_data:/root/.ollama
    restart: always
    environment:
      - TZ=${TZ}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-r1:8b}
      - DEEPSEEK_EMBED_MODEL=${DEEPSEEK_EMBED_MODEL:-nomic-embed-text}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  openaiapp :
    build:
      dockerfile: Dockerfile_app
    env_file:
      - .env
    environment:
      - TZ=${TZ}
      # DeepSeek configuration
      - USE_DEEPSEEK=true
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-http://deepseek:11434}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-r1:8b}
      - DEEPSEEK_EMBED_MODEL=${DEEPSEEK_EMBED_MODEL:-nomic-embed-text}
      # Default models for fallback
      - MODEL=${MODEL:-deepseek-r1:8b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      # Couchbase connection
      - COUCHBASE_HOST=couchbase
      - COUCHBASE_ADMINISTRATOR_USERNAME=${COUCHBASE_ADMINISTRATOR_USERNAME:-admin}
      - COUCHBASE_ADMINISTRATOR_PASSWORD=${COUCHBASE_ADMINISTRATOR_PASSWORD:-password}
      # History settings
      - USE_HISTORY_IN_QUERIES=${USE_HISTORY_IN_QUERIES:-false}
      # Semantic chunking settings
      - USE_SEMANTIC_CHUNKING=${USE_SEMANTIC_CHUNKING:-true}
      - USE_METADATA_EXTRACTION=${USE_METADATA_EXTRACTION:-true}
      - SEMANTIC_CHUNKING_DOC_LIMIT=${SEMANTIC_CHUNKING_DOC_LIMIT:-50}
    volumes:
      - ./logs:/app/logs
      - ./load:/app/load
      - ./templates:/app/templates
    restart: always
    depends_on:
      couchbase:
        condition: service_healthy
      postgres:
        condition: service_healthy
      deepseek:
        condition: service_healthy

volumes:
  couchbase_data:
  couchbase_init:
  postgres_data:
  deepseek_data: